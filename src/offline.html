<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <title>You're offline | KG CEC Network</title>
    <link rel="icon" href="assets/app-icon-192.png" type="image/png" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3ef; color: #0d1726; font: 16px/1.6 Inter, Arial, sans-serif; }
      main { width: min(440px, calc(100% - 40px)); padding: 36px; border-radius: 24px; background: #fff; box-shadow: 0 18px 50px rgba(8, 17, 31, .12); text-align: center; }
      img { width: min(260px, 100%); margin: 0 auto 24px; }
      h1 { margin: 0 0 12px; }
      p { color: #516076; }
      button { min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #f1b24a, #f77a1f); color: #111827; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="assets/kg-logo.png" alt="KG Multisector Limited" />
      <h1>You're offline</h1>
      <p>Connect to the internet to open your network pages, messages, and member account.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
